[project]
name = "rag-chatbot"
version = "0.1.0"
description = "Streamlit chatbot that compares three RAG pipelines over a set of PDFs"
readme = "README.md"
requires-python = "==3.13.*"
# LangChain-family versions are pinned to 0.3.x: several imports used here (langchain.retrievers,
# langchain.storage, langchain.text_splitter) moved in LangChain 1.x.
dependencies = [
    "python-dotenv==1.2.4",
    "openai==2.54.0",
    "langchain==0.3.30",
    "langchain-core==0.3.86",
    "langchain-community==0.3.31",
    "langchain-text-splitters==0.3.11",
    "langchain-openai==0.3.35",
    "langchain-qdrant==0.2.1",
    "langchain-cohere==0.4.4",
    "cohere>=5.12.0,<5.13.0",
    "langgraph==0.6.7",
    "qdrant-client==1.19.1",
    "pymupdf==1.28.2",
    "streamlit>=1.40",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_chatbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls real external APIs (run with RUN_LIVE_TESTS=1)"]
